[package]
name = "wax-phishing"
version = "0.1.1"
edition = "2021"
description = "Wax plugin: warns about likely phishing in new mail"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built on its own (scripts/build-plugins.sh), not part of the app's build.
[workspace]
