[package]
name = "gpui-mail"
version = "0.1.0"
edition = "2021"
description = "A bare-bones, plugin-extensible email client built on GPUI"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
gpui-kit = "0.10"
html2text = "0.17.4"
io-email = { version = "0.1.0", default-features = false, features = ["imap", "smtp", "rustls-ring", "search"] }
io-smtp = { version = "0.1", default-features = false }
mail-builder = "2.0.1"
markdown = "1.0.0"
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
pimalaya-stream = { version = "0.0.1", default-features = false, features = ["std"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
secrecy = "0.10"
serde_json = "1"
sha2 = "0.10"
ureq = "2"
url = "2.5.8"
wry = "0.57.3"
# Plugin host: WebAssembly components, sandboxed (no files, no network).
wasmtime = "51"
wasmtime-wasi = "51"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-user-notifications = { version = "0.3", features = ["block2"] }
block2 = "0.6"

# GPUI is heavy; keep dependencies optimized so dev builds stay responsive.
[profile.dev.package."*"]
opt-level = 2

# Smaller, faster app for scripts/install.sh.
[profile.release]
lto = "thin"
